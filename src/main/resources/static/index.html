<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Att göra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <h1>Att göra</h1>

    <div id="message" class="message" hidden></div>

    <section class="card">
        <h2 id="form-title">Ny uppgift</h2>
        <form id="todo-form" novalidate>
            <input type="hidden" id="todo-id">

            <div class="field">
                <label for="title">Titel *</label>
                <input type="text" id="title" name="title" maxlength="255">
                <p class="field-error" data-error-for="title"></p>
            </div>

            <div class="field">
                <label for="description">Beskrivning</label>
                <textarea id="description" name="description" rows="3" maxlength="1000"></textarea>
                <p class="field-error" data-error-for="description"></p>
            </div>

            <div class="row">
                <div class="field">
                    <label for="priority">Prioritet</label>
                    <select id="priority" name="priority">
                        <option value="HIGH">Hög</option>
                        <option value="MEDIUM" selected>Medel</option>
                        <option value="LOW">Låg</option>
                    </select>
                    <p class="field-error" data-error-for="priority"></p>
                </div>

                <div class="field">
                    <label for="dueDate">Förfallodatum</label>
                    <input type="date" id="dueDate" name="dueDate">
                    <p class="field-error" data-error-for="dueDate"></p>
                </div>
            </div>

            <div class="actions">
                <button type="submit" id="submit-btn" class="primary">Lägg till</button>
                <button type="button" id="cancel-btn" hidden>Avbryt</button>
            </div>
        </form>
    </section>

    <nav class="filters" aria-label="Filtrera uppgifter">
        <button type="button" class="filter active" data-filter="all">Alla</button>
        <button type="button" class="filter" data-filter="false">Ej klara</button>
        <button type="button" class="filter" data-filter="true">Klara</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty" class="empty" hidden>Inga uppgifter att visa.</p>
</main>

<script src="app.js"></script>
</body>
</html>
